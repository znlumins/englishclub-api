<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" style="background-color: var(--udemy-dark);">
    <a href="/dashboard.html" class="navbar-brand" style="color: var(--udemy-white);">Instructor Dashboard</a>
    <div class="nav-links">
      <a href="/dashboard.html" class="btn btn-secondary" style="color: var(--udemy-white); border-color: var(--udemy-white);">Student View</a>
    </div>
  </nav>

  <main class="container mt-4 mb-4">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
      <h1 style="font-size: 32px;">Courses</h1>
      <button id="showCreateFormBtn" class="btn btn-primary">New Course</button>
    </div>

    <!-- Form Create Class (Hidden by default) -->
    <div id="createClassFormContainer" style="display: none; border: 1px solid var(--udemy-border); padding: 24px; margin-bottom: 32px;">
      <h2 style="font-size: 20px; margin-bottom: 16px;">Create a New Course</h2>
      <form id="createClassForm">
        <div class="form-group">
          <label>Course Title</label>
          <input type="text" id="classNameInput" class="form-control" required placeholder="e.g. Learn English from Scratch">
        </div>
        <div class="form-group">
          <label>Course Description</label>
          <input type="text" id="classDescInput" class="form-control" required placeholder="Brief explanation">
        </div>
        <div style="display: flex; gap: 12px; margin-top: 16px;">
          <button type="submit" class="btn btn-primary">Save Course</button>
          <button type="button" id="cancelCreateBtn" class="btn btn-secondary">Cancel</button>
        </div>
      </form>
    </div>

    <div id="managedClassesGrid" class="class-grid">
      <!-- Diisi oleh JS -->
      <p style="color: var(--udemy-gray-text);">Loading your courses...</p>
    </div>
  </main>

  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAdminAccess();
      loadManagedClasses();

      document.getElementById('showCreateFormBtn').addEventListener('click', () => {
        document.getElementById('createClassFormContainer').style.display = 'block';
      });
      document.getElementById('cancelCreateBtn').addEventListener('click', () => {
        document.getElementById('createClassFormContainer').style.display = 'none';
      });
      
      document.getElementById('createClassForm').addEventListener('submit', createClass);
    });
  </script>
</body>
</html>

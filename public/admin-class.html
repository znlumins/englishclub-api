<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Course - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" style="background-color: var(--udemy-dark);">
    <a href="/admin-dashboard.html" class="navbar-brand" style="color: var(--udemy-white);">Instructor Dashboard</a>
    <div class="nav-links">
      <a href="/admin-dashboard.html" class="btn btn-secondary" style="color: var(--udemy-white); border-color: var(--udemy-white);">Back to Courses</a>
    </div>
  </nav>

  <div style="background-color: var(--udemy-gray-light); padding: 48px 24px; border-bottom: 1px solid var(--udemy-border);">
    <div class="container">
      <h1 id="className" style="font-size: 32px; font-weight: 700; margin-bottom: 16px;">Loading...</h1>
      <p id="classDesc" style="font-size: 18px; color: var(--udemy-gray-text);"></p>
    </div>
  </div>

  <main class="container mt-4 mb-4">
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 48px; margin-top: 32px;">
      
      <!-- Kolom Materi -->
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <h2 style="font-size: 24px;">Curriculum</h2>
          <button id="showMaterialFormBtn" class="btn btn-primary" style="padding: 8px 16px;">+ Add Curriculum Item</button>
        </div>

        <div id="materialFormContainer" style="display: none; border: 1px solid var(--udemy-border); padding: 24px; margin-bottom: 24px;">
          <form id="materialForm">
            <div class="form-group">
              <label>Title</label>
              <input type="text" id="matTitle" class="form-control" required>
            </div>
            <div class="form-group">
              <label>URL (Link)</label>
              <input type="url" id="matUrl" class="form-control" required placeholder="https://...">
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
              <label>Type</label>
              <select id="matType" class="form-control">
                <option value="link">Document / Website Link</option>
                <option value="video">Video (YouTube)</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Save Item</button>
          </form>
        </div>

        <div id="materialList" class="material-list">
          <p style="padding: 16px; text-align: center; color: var(--udemy-gray-text); background-color: white;">Loading curriculum...</p>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 48px; margin-bottom: 24px;">
          <h2 style="font-size: 24px;">Quizzes</h2>
          <button id="showQuizFormBtn" class="btn btn-primary" style="padding: 8px 16px;">+ Add Quiz</button>
        </div>

        <div id="quizFormContainer" style="display: none; border: 1px solid var(--udemy-border); padding: 24px; margin-bottom: 24px; background-color: var(--udemy-gray-light);">
          <form id="quizForm">
            <div class="form-group">
              <label>Quiz Title</label>
              <input type="text" id="quizTitle" class="form-control" required placeholder="e.g. Chapter 1 Quiz">
            </div>
            
            <div id="questionsContainer">
              <!-- Dynamically added questions go here -->
            </div>
            
            <button type="button" id="addQuestionBtn" class="btn btn-secondary" style="margin-bottom: 24px;">+ Add Question</button>
            <br>
            <button type="submit" class="btn btn-primary" style="background-color: var(--udemy-purple); width: 100%;">Save Quiz</button>
          </form>
        </div>

      </div>

      <!-- Kolom Siswa -->
      <div>
        <h2 style="font-size: 24px; margin-bottom: 24px;">Students</h2>
        <div style="border: 1px solid var(--udemy-border);">
          <ul id="memberList" style="list-style: none; padding: 0; margin: 0;">
            <p style="padding: 16px; text-align: center; color: var(--udemy-gray-text);">Loading students...</p>
          </ul>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAdminAccess();
      
      const urlParams = new URLSearchParams(window.location.search);
      const classId = urlParams.get('id');
      
      if (!classId) {
        document.getElementById('className').innerText = "Invalid Course";
        return;
      }

      loadClassDetailsAndMaterials(classId);
      loadClassMembers(classId);

      document.getElementById('showMaterialFormBtn').addEventListener('click', () => {
        const form = document.getElementById('materialFormContainer');
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
      });

      document.getElementById('materialForm').addEventListener('submit', (e) => addMaterial(e, classId));
    });
  </script>
</body>
</html>

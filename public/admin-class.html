<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Class - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: var(--light-gray);">
  <nav class="navbar">
    <a href="/admin-dashboard.html" class="navbar-brand">English Club Admin</a>
    <div class="nav-links">
      <a href="/admin-dashboard.html" class="btn btn-secondary" style="border: 4px solid #1A1A1A; box-shadow: 4px 4px 0 0 #1A1A1A;">Back to Admin</a>
    </div>
  </nav>

  <main class="container mt-4">
    <div class="card" style="background-color: var(--hot-pink);">
      <h1 id="className" style="font-size: 32px; color: white; -webkit-text-stroke: 1px black;">Memuat Kelas...</h1>
      <p id="classDesc" style="color: white; font-weight: 600;"></p>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 32px;">
      
      <!-- Kolom Materi -->
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h2>Materi Kelas</h2>
          <button id="showMaterialFormBtn" class="btn btn-primary" style="padding: 8px 16px; font-size: 14px;">+ Materi</button>
        </div>

        <div id="materialFormContainer" class="card" style="display: none; background-color: var(--primary-yellow); padding: 16px;">
          <form id="materialForm">
            <div class="form-group" style="margin-bottom: 12px;">
              <label>Judul Materi</label>
              <input type="text" id="matTitle" class="form-control" required style="padding: 8px;">
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
              <label>Link URL</label>
              <input type="url" id="matUrl" class="form-control" required placeholder="https://..." style="padding: 8px;">
            </div>
            <div class="form-group" style="margin-bottom: 16px;">
              <label>Tipe</label>
              <select id="matType" class="form-control" style="padding: 8px;">
                <option value="link">Link Dokumen / Web</option>
                <option value="video">Video URL (YouTube)</option>
              </select>
            </div>
            <button type="submit" class="btn btn-success" style="width: 100%;">Tambah Materi</button>
          </form>
        </div>

        <div id="materialList" class="material-list">
          <p>Memuat materi...</p>
        </div>
      </div>

      <!-- Kolom Siswa -->
      <div>
        <h2 style="margin-bottom: 16px;">Daftar Siswa (Member)</h2>
        <div class="card">
          <ul id="memberList" style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px;">
            <p>Memuat siswa...</p>
          </ul>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAdminAccess();
      
      const urlParams = new URLSearchParams(window.location.search);
      const classId = urlParams.get('id');
      
      if (!classId) {
        document.getElementById('className').innerText = "Kelas Invalid";
        return;
      }

      loadClassDetailsAndMaterials(classId);
      loadClassMembers(classId);

      document.getElementById('showMaterialFormBtn').addEventListener('click', () => {
        const form = document.getElementById('materialFormContainer');
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
      });

      document.getElementById('materialForm').addEventListener('submit', (e) => addMaterial(e, classId));
    });
  </script>
</body>
</html>

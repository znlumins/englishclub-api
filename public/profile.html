<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: var(--light-gray);">
  <nav class="navbar">
    <a href="/dashboard.html" class="navbar-brand">English Club</a>
    <div class="nav-links">
      <a href="/leaderboard.html" class="btn btn-secondary" style="border: 4px solid #1A1A1A; box-shadow: 4px 4px 0 0 #1A1A1A; background-color: var(--hot-pink);">Leaderboard</a>
      <a href="/dashboard.html" class="btn btn-primary" style="border: 4px solid #1A1A1A; box-shadow: 4px 4px 0 0 #1A1A1A;">Dashboard</a>
    </div>
  </nav>

  <main class="container mt-4">
    <div class="card" style="background-color: var(--pure-white); text-align: center;">
      <h1 style="font-size: 40px; margin-bottom: 8px;" id="profileName">Memuat...</h1>
      <p id="profileNim" style="font-weight: 700; margin-bottom: 24px; color: #555;"></p>
      
      <div style="display: flex; justify-content: center; gap: 24px; margin-bottom: 32px;">
        <div class="card" style="background-color: var(--primary-yellow); padding: 16px; border-width: 4px; display: inline-block;">
          <h3 style="font-size: 16px;">Total Poin</h3>
          <p id="profilePoints" style="font-size: 32px; font-weight: 800; margin: 0;">0</p>
        </div>
        <div class="card" style="background-color: var(--hot-pink); padding: 16px; border-width: 4px; display: inline-block;">
          <h3 style="font-size: 16px; color: white;">Streak 🔥</h3>
          <p id="profileStreak" style="font-size: 32px; font-weight: 800; margin: 0; color: white;">0 Hari</p>
        </div>
      </div>

      <button id="showEditBtn" class="btn btn-secondary">Edit Profil</button>
    </div>

    <!-- Edit Form -->
    <div id="editProfileFormContainer" class="card mt-4" style="display: none; background-color: var(--electric-blue);">
      <h2 style="color: white; margin-bottom: 16px;">Edit Profil</h2>
      <form id="editProfileForm">
        <div class="form-group">
          <label style="color: white;">Bio (Opsional)</label>
          <input type="text" id="bioInput" class="form-control" placeholder="Tuliskan sesuatu tentangmu...">
        </div>
        <div class="form-group">
          <label style="color: white;">No. HP</label>
          <input type="text" id="phoneInput" class="form-control" placeholder="08...">
        </div>
        <div class="form-group">
          <label style="color: white;">Program Studi</label>
          <input type="text" id="prodiInput" class="form-control" placeholder="Contoh: Teknologi Informasi">
        </div>
        <button type="submit" class="btn btn-primary" style="background-color: var(--primary-yellow); width: 100%;">Simpan Perubahan</button>
      </form>
    </div>
  </main>

  <script src="/js/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard.html" class="navbar-brand">English Club</a>
    <div class="nav-links">
      <a href="/leaderboard.html" class="btn btn-secondary">Leaderboard</a>
      <a href="/dashboard.html" class="btn btn-primary">Dashboard</a>
    </div>
  </nav>

  <main class="container mt-4 mb-4">
    <div style="display: flex; gap: 32px; align-items: flex-start;">
      <!-- Profile Sidebar -->
      <div style="flex: 1; min-width: 300px; text-align: center; border: 1px solid var(--udemy-border); padding: 32px;">
        <div style="width: 120px; height: 120px; border-radius: 50%; background-color: var(--udemy-dark); color: var(--udemy-white); font-size: 48px; line-height: 120px; margin: 0 auto 16px;">
          <span id="profileInitial">A</span>
        </div>
        <h1 id="profileName" style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">Loading...</h1>
        <p id="profileNim" style="font-size: 14px; color: var(--udemy-gray-text); margin-bottom: 24px;"></p>
        
        <div style="display: flex; justify-content: space-around; border-top: 1px solid var(--udemy-border); padding-top: 16px; margin-bottom: 24px;">
          <div>
            <div style="font-size: 24px; font-weight: 700;" id="profilePoints">0</div>
            <div style="font-size: 12px; color: var(--udemy-gray-text);">Points</div>
          </div>
          <div>
            <div style="font-size: 24px; font-weight: 700;" id="profileStreak">0</div>
            <div style="font-size: 12px; color: var(--udemy-gray-text);">Streak Days</div>
          </div>
        </div>

        <button id="showEditBtn" class="btn btn-secondary" style="width: 100%;">Edit Profile</button>
      </div>

      <!-- Edit Form Area -->
      <div style="flex: 2;">
        <div id="editProfileFormContainer" style="display: none; border: 1px solid var(--udemy-border); padding: 32px;">
          <h2 style="font-size: 24px; margin-bottom: 24px;">Edit Public Profile</h2>
          <form id="editProfileForm">
            <div class="form-group">
              <label>Bio</label>
              <input type="text" id="bioInput" class="form-control" placeholder="Tell us about yourself">
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="text" id="phoneInput" class="form-control" placeholder="08...">
            </div>
            <div class="form-group">
              <label>Major / Study Program</label>
              <input type="text" id="prodiInput" class="form-control" placeholder="Information Technology">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 16px;">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/profile.js"></script>
</body>
</html>

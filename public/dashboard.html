<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard.html" class="navbar-brand">English Club</a>
    <div class="nav-links">
      <a href="/leaderboard.html" class="btn btn-secondary">Leaderboard</a>
      <a href="/profile.html" class="btn btn-secondary">Profil</a>
      <a href="/classes.html" class="btn btn-secondary">Cari Kelas</a>
      <a href="#" id="logoutBtn" class="btn btn-secondary">Logout</a>
    </div>
  </nav>

  <div class="banner">
    <div class="banner-content">
      <h1 class="banner-title">Welcome back, <span id="userName">Student</span>!</h1>
      <p class="banner-text">Ready to learn something new today?</p>
    </div>
  </div>

  <main class="container mb-4">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="font-size: 24px;">My learning</h2>
      <a href="/classes.html" class="btn btn-secondary">Explore courses</a>
    </div>

    <div id="myClassesGrid" class="class-grid">
      <!-- Diisi oleh JS -->
      <p style="color: var(--udemy-gray-text);">Loading your courses...</p>
    </div>
  </main>

  <script src="/js/classes.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user) {
        window.location.href = '/login.html';
        return;
      }
      document.getElementById('userName').innerText = user.full_name;
      
      if (user.role === 'admin' || user.role === 'instructor') {
        const navLinks = document.querySelector('.nav-links');
        const adminBtn = document.createElement('a');
        adminBtn.href = '/admin-dashboard.html';
        adminBtn.className = 'btn btn-primary';
        adminBtn.innerText = 'Admin Panel';
        navLinks.insertBefore(adminBtn, document.getElementById('logoutBtn'));
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/';
      });

      loadMyClasses();
    });
  </script>
</body>
</html>

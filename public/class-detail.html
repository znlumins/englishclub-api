<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Kelas - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard.html" class="navbar-brand">English Club</a>
    <div class="nav-links">
      <a href="/dashboard.html" class="btn btn-secondary">Dashboard</a>
    </div>
  </nav>

  <div style="background-color: var(--udemy-dark); color: var(--udemy-white); padding: 48px 24px;">
    <div class="container">
      <h1 id="className" style="font-size: 32px; font-weight: 700; margin-bottom: 16px;">Loading...</h1>
      <p id="classDesc" style="font-size: 18px; margin-bottom: 16px;"></p>
      <div style="font-size: 14px; color: #D1D7DC; margin-bottom: 16px;">Created by <a href="#" id="classInstructor" style="color: var(--udemy-white); text-decoration: underline;">Instructor</a></div>
    </div>
  </div>

  <main class="container mt-4 mb-4">
    <h2 style="font-size: 24px; margin-bottom: 16px;">Course content</h2>
    <div id="materialList" class="material-list">
      <!-- Diisi oleh JS -->
      <p style="padding: 16px;">Loading materials...</p>
    </div>
  </main>

  <script src="/js/classes.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('token')) {
        window.location.href = '/login.html';
        return;
      }
      const urlParams = new URLSearchParams(window.location.search);
      const classId = urlParams.get('id');
      if (classId) {
        loadClassDetail(classId);
      } else {
        document.getElementById('className').innerText = "Class not found";
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .question-block {
      margin-bottom: 32px;
      padding: 24px;
      border: 1px solid var(--udemy-border);
      background-color: var(--udemy-white);
    }
    .question-text {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .option-label {
      display: block;
      padding: 12px 16px;
      border: 1px solid var(--udemy-border);
      margin-bottom: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .option-label:hover {
      background-color: var(--udemy-gray-light);
    }
    .option-label input {
      margin-right: 12px;
    }
  </style>
</head>
<body style="background-color: var(--udemy-gray-light);">
  <nav class="navbar" style="background-color: var(--udemy-dark);">
    <a href="/dashboard.html" class="navbar-brand" style="color: var(--udemy-white);" id="quizNavTitle">Quiz</a>
    <div class="nav-links">
      <a href="#" onclick="window.history.back()" class="btn btn-secondary" style="color: var(--udemy-white); border-color: var(--udemy-white);">Close</a>
    </div>
  </nav>

  <main class="container mt-4 mb-4" style="max-width: 800px;">
    <div id="quizHeader" style="margin-bottom: 32px; text-align: center;">
      <h1 id="quizTitle" style="font-size: 32px; margin-bottom: 8px;">Loading Quiz...</h1>
      <p id="quizMeta" style="color: var(--udemy-gray-text);"></p>
    </div>

    <form id="quizSubmitForm">
      <div id="questionsContainer">
        <p style="text-align: center;">Loading questions...</p>
      </div>
      
      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; font-size: 18px; padding: 16px; display: none;">Submit Quiz</button>
    </form>

    <div id="resultContainer" style="display: none; text-align: center; padding: 48px 24px; background-color: var(--udemy-white); border: 1px solid var(--udemy-border);">
      <h2 style="font-size: 32px; margin-bottom: 16px;">Quiz Completed!</h2>
      <div style="font-size: 64px; font-weight: 700; color: var(--udemy-purple); margin-bottom: 24px;" id="resultScore">100</div>
      <p style="font-size: 18px; margin-bottom: 32px;">Great job! You earned +20 points.</p>
      <a href="/dashboard.html" class="btn btn-primary">Back to Dashboard</a>
    </div>
  </main>

  <script src="/js/quiz.js"></script>
</body>
</html>

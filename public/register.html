<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--udemy-gray-light);">
  
  <div class="auth-container" style="width: 100%;">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 class="navbar-brand">English Club</h1>
    </div>
    <div class="auth-title" style="text-align: center; font-size: 16px; border: none; margin-bottom: 16px;">Sign up and start learning</div>
    
    <div id="errorMsg" class="error-message"></div>
    <div id="successMsg" class="success-message"></div>
    
    <form id="registerForm">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="fullName" class="form-control" required placeholder="Full Name">
      </div>
      <div class="form-group">
        <label>NIM</label>
        <input type="text" id="nim" class="form-control" required placeholder="NIM">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" class="form-control" required placeholder="name@vokasi.ac.id">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" required placeholder="Create password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">Sign up</button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--udemy-gray-text);">
      Already have an account? <a href="/login.html" style="font-weight: 700; text-decoration: underline;">Log in</a>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>

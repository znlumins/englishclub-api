<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .rank-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 24px;
    }
    .rank-table th, .rank-table td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid var(--udemy-border);
    }
    .rank-table th {
      font-size: 14px;
      color: var(--udemy-gray-text);
      font-weight: 700;
    }
    .rank-table tr:hover td {
      background-color: var(--udemy-gray-light);
    }
    .rank-1 td { background-color: #F8F9FA; font-weight: 700; }
    .trophy { display: inline-block; width: 24px; text-align: center; margin-right: 8px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard.html" class="navbar-brand">English Club</a>
    <div class="nav-links">
      <a href="/profile.html" class="btn btn-secondary">Profil</a>
      <a href="/dashboard.html" class="btn btn-primary">Dashboard</a>
    </div>
  </nav>

  <div class="banner">
    <div class="banner-content">
      <h1 class="banner-title">Leaderboard</h1>
      <p class="banner-text">Top 10 most active members in the English Club.</p>
    </div>
  </div>

  <main class="container mb-4">
    <table class="rank-table">
      <thead>
        <tr>
          <th style="width: 80px;">Rank</th>
          <th>Student</th>
          <th style="width: 120px;">Streak</th>
          <th style="width: 120px; text-align: right;">Points</th>
        </tr>
      </thead>
      <tbody id="leaderboardContainer">
        <tr>
          <td colspan="4" style="text-align: center; color: var(--udemy-gray-text);">Loading leaderboard...</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script src="/js/leaderboard.js"></script>
</body>
</html>

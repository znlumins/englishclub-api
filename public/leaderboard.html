<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border: 4px solid var(--jet-black);
      background-color: var(--pure-white);
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 700;
    }
    .rank-1 { background-color: var(--primary-yellow); }
    .rank-2 { background-color: var(--light-gray); }
    .rank-3 { background-color: var(--hot-pink); color: white; -webkit-text-stroke: 1px black; }
  </style>
</head>
<body style="background-color: var(--electric-blue);">
  <nav class="navbar">
    <a href="/dashboard.html" class="navbar-brand">English Club</a>
    <div class="nav-links">
      <a href="/profile.html" class="btn btn-secondary" style="border: 4px solid #1A1A1A; box-shadow: 4px 4px 0 0 #1A1A1A; background-color: var(--primary-yellow);">Profil</a>
      <a href="/dashboard.html" class="btn btn-primary" style="border: 4px solid #1A1A1A; box-shadow: 4px 4px 0 0 #1A1A1A;">Dashboard</a>
    </div>
  </nav>

  <main class="container mt-4">
    <div class="card" style="background-color: var(--pure-white); text-align: center; border-width: 4px;">
      <h1 style="font-size: 48px; margin-bottom: 16px;">🔥 Papan Peringkat 🔥</h1>
      <p style="font-size: 18px;">Top 10 Member Paling Aktif di English Club</p>
    </div>

    <div id="leaderboardContainer" style="margin-top: 32px;">
      <p style="color: white; font-weight: bold; font-size: 24px; text-align: center;">Memuat Peringkat...</p>
    </div>
  </main>

  <script src="/js/leaderboard.js"></script>
</body>
</html>

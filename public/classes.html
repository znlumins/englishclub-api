<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Kelas - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: var(--electric-blue);">
  <nav class="navbar">
    <a href="/dashboard.html" class="navbar-brand">English Club</a>
    <div class="nav-links">
      <a href="/dashboard.html" class="btn btn-primary" style="border: 4px solid #1A1A1A; box-shadow: 4px 4px 0 0 #1A1A1A;">Dashboard</a>
    </div>
  </nav>

  <main class="container mt-4">
    <div class="card" style="background-color: var(--pure-white);">
      <h1 style="font-size: 48px;">Katalog Kelas</h1>
      <p style="font-size: 18px;">Temukan kelas yang sesuai dengan minat dan kemampuanmu.</p>
    </div>

    <div id="allClassesGrid" class="class-grid">
      <!-- Diisi oleh JS -->
      <p>Sedang memuat katalog kelas...</p>
    </div>
  </main>

  <script src="/js/classes.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('token')) {
        window.location.href = '/login.html';
        return;
      }
      loadAllClasses();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Kelas - English Club</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard.html" class="navbar-brand">English Club</a>
    <div class="nav-links">
      <a href="/dashboard.html" class="btn btn-secondary">Dashboard</a>
    </div>
  </nav>

  <main class="container mt-4 mb-4">
    <h1 style="font-size: 32px; margin-bottom: 8px;">Explore All Courses</h1>
    <p style="color: var(--udemy-gray-text); font-size: 16px; margin-bottom: 24px;">Find the right class for your goals.</p>

    <div id="allClassesGrid" class="class-grid">
      <!-- Diisi oleh JS -->
      <p style="color: var(--udemy-gray-text);">Loading catalog...</p>
    </div>
  </main>

  <script src="/js/classes.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('token')) {
        window.location.href = '/login.html';
        return;
      }
      loadAllClasses();
    });
  </script>
</body>
</html>

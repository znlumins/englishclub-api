services:
  - type: web
    name: lso-vokasi-app
    env: node
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lso-postgres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: lso-postgres-db
    databaseName: lsodb
    user: lso_user
